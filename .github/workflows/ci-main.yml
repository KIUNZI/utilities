name: CI (Main Build)

on:
  push:
    branches:
      - main
    tags-ignore:
      - '*'
    paths-ignore:
      - '.github/**'
      - '.gitattributes'
      - '.gitignore'

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-utilities-main
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ARTIFACTS_REPO_USER: ${{ secrets.ARTIFACTS_REPO_USER }}
      ARTIFACTS_REPO_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      QUARKUS_CONTAINER_IMAGE_USERNAME: jasonmarstoncouk
      QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew --no-daemon clean build -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true

      - name: Publish artifacts
        run: ./gradlew --no-daemon publish


